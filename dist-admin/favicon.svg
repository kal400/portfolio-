<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="glowCore" cx="60%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0077ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040609" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Radial Cyber Core Glow -->
  <rect width="512" height="512" rx="128" fill="url(#glowCore)"/>

  <!-- Precision Inset Border -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Geometric Executive 'K' -->
  <g filter="url(#softGlow)">
    <!-- Vertical Pillar -->
    <rect x="124" y="104" width="68" height="304" rx="18" fill="url(#kGrad)"/>

    <!-- Upper Diagonal Arm -->
    <path d="M 216 264 L 340 126 C 347 118 359 118 367 126 L 384 143 C 392 151 392 163 384 171 L 272 290 Z" fill="url(#kGrad)"/>

    <!-- Lower Diagonal Leg -->
    <path d="M 252 268 L 385 391 C 393 399 393 411 385 419 L 368 436 C 360 444 348 444 340 436 L 206 312 Z" fill="url(#kGrad)"/>

    <!-- Ambient Cyan Terminal Pulse Node -->
    <circle cx="360" cy="148" r="8" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
